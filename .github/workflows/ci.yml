name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      # The git layer is tested against real repositories, so the runner's git
      # needs an identity for the commits those tests make.
      - name: Configure git
        run: |
          git config --global user.name "repohop ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch master
          git config --global protocol.file.allow always
          git config --global core.autocrlf false

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - name: Nothing private in a public repo
        run: ./scripts/check-clean.sh
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
